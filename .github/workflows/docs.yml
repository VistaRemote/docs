name: Docs

on:
  push:
    branches: [main, dev]
    paths:
      - '**'
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '24.11'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build
        run: pnpm build
